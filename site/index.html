<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Beyond GDP dashboard</title>
  <meta name="description" content="The indicators proposed by the UN High-Level Expert Group on Beyond GDP, with open data and their limitations.">
  <meta name="color-scheme" content="light dark">
  <script>
    // apply the saved theme before first paint to avoid a flash
    try { const t = localStorage.getItem("bgdp-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="preload" href="fonts/roboto-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%230B7CC4'/%3E%3Cpath d='M16 4l3 12-3 12-3-12z' fill='white'/%3E%3C/svg%3E">
</head>
<body>
  <a class="skip" href="#main">Skip to indicators</a>

  <header class="masthead">
    <div class="wrap masthead-inner">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M16 3l3.2 13L16 29l-3.2-13z" fill="currentColor"/><path d="M3 16l13-3.2L29 16l-13 3.2z" fill="currentColor" opacity=".45"/></svg>
        <div>
          <h1>Beyond GDP</h1>
          <p class="brand-sub">The UN expert group's proposed indicators, filled with open data</p>
        </div>
      </div>
      <div class="theme-switch" role="radiogroup" aria-label="Colour theme">
        <button type="button" role="radio" data-theme-choice="light" title="Light">Light</button>
        <button type="button" role="radio" data-theme-choice="dark" title="Dark">Dark</button>
        <button type="button" role="radio" data-theme-choice="system" title="Follow system setting">System</button>
      </div>
    </div>
  </header>

  <div class="controls" id="controls">
    <div class="wrap controls-inner">
      <div class="pickers">
        <label class="picker">
          <span class="picker-label">Country</span>
          <span class="picker-swatch swatch-a" aria-hidden="true"></span>
          <select id="country-a"></select>
        </label>
        <label class="picker">
          <span class="picker-label">Compare with</span>
          <span class="picker-swatch swatch-b" aria-hidden="true"></span>
          <select id="country-b"></select>
        </label>
      </div>
      <div class="view-switch" role="radiogroup" aria-label="Which indicators to show">
        <button type="button" role="radio" data-view="all">All indicators</button>
        <button type="button" role="radio" data-view="pinned">Pinned <span id="pin-count" class="count">0</span></button>
      </div>
      <div class="control-links">
        <button type="button" class="link-btn" data-open="legend-dialog">How to read</button>
        <button type="button" class="link-btn" data-open="about-dialog">About</button>
      </div>
    </div>
  </div>

  <main id="main" class="wrap" tabindex="-1">
    <div id="banner"></div>
    <div id="dashboard" aria-live="polite"></div>
  </main>

  <footer class="wrap footer" id="footer"></footer>

  <dialog id="detail-dialog" class="sheet" aria-labelledby="detail-title"><div class="sheet-body" id="detail-body"></div></dialog>
  <dialog id="legend-dialog" class="sheet" aria-labelledby="legend-title"><div class="sheet-body" id="legend-body"></div></dialog>
  <dialog id="about-dialog" class="sheet" aria-labelledby="about-title"><div class="sheet-body" id="about-body"></div></dialog>
  <dialog id="health-dialog" class="sheet" aria-labelledby="health-title"><div class="sheet-body" id="health-body"></div></dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>

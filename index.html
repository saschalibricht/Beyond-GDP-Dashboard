<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Beyond GDP dashboard</title>
    <meta
      name="description"
      content="The indicators proposed by the UN High-Level Expert Group on Beyond GDP, with open data and their limitations."
    />
    <meta name="color-scheme" content="light dark" />
    <script>
      // apply the saved theme before first paint to avoid a flash
      try {
        const t = localStorage.getItem("bgdp-theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='2' width='13' height='13' rx='4' fill='%23cf5582'/%3E%3Crect x='17' y='2' width='13' height='13' rx='4' fill='%23e0a019'/%3E%3Crect x='2' y='17' width='13' height='13' rx='4' fill='%23af62c1'/%3E%3Crect x='17' y='17' width='13' height='13' rx='4' fill='%234a9c36'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="app"></div>
    <noscript>This dashboard needs JavaScript to display its data.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

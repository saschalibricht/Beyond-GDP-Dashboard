# Render Blueprint: one free static site, no server, no build step.
# Render redeploys automatically whenever the daily GitHub Action commits new data.
services:
  - type: web
    name: beyond-gdp-dashboard
    runtime: static
    buildCommand: ""
    staticPublishPath: ./site
    pullRequestPreviewsEnabled: false
    headers:
      - path: /data/*
        name: Cache-Control
        value: no-cache
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /fonts/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

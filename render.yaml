# Render Blueprint: one free static site, no server.
# Render builds the Svelte app (about a minute) and serves ./dist. It redeploys
# whenever main changes, including the daily data commits from GitHub Actions.
services:
  - type: web
    name: beyond-gdp-dashboard
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: NODE_VERSION
        value: "22"
    headers:
      - path: /data/*
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
